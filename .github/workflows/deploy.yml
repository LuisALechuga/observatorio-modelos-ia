name: Actualizar y publicar observatorio
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observatorio-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sincronizar catálogo
        run: python scripts/sync.py
      - name: Generar árbol de últimos modelos (selección provisional)
        run: python scripts/generate_infographic.py
      - name: Comprobar selección e imágenes publicables
        run: python -m unittest discover -s tests
      - name: Guardar datos históricos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/ site/assets/arbol-modelos.svg site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo automático"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
